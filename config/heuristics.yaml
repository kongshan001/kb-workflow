# Heuristic rules for auto-classification
# v0.2.0: only used when user explicitly invokes /kb-capture
# Auto-classification is NO LONGER run on every user input

rules:
  - priority: 100
    name: explicit_decision
    type: decision
    pattern: "\\b(我们决定|我决定|敲定|定下来|选了|选了用|定为)\\b"

  - priority: 95
    name: force_override
    type: <user-specified>
    pattern: "^/kb-capture-force\\s+(fact|preference|decision|tentative)\\s+"
    note: "/kb-capture-force <type> <text> 跳过启发式，强制归类"

  - priority: 90
    name: explicit_preference
    type: preference
    pattern: "^(记住|别|不要|avoid|don't|never|always|以后都)\\b"

  - priority: 85
    name: explicit_tentative
    type: tentative
    pattern: "\\b(想试试|考虑|也许|或许|先放着|可以试试)\\b"

  - priority: 80
    name: explicit_fact
    type: fact
    pattern: "^(https?://|www\\.)"
    note: 短 URL 默认归 fact；如要保存原文用 /kb-save-article

  - priority: 70
    name: past_tense_fact
    type: fact
    pattern: "^(根据|据|published|released|introduced|上线了|发布了)"

  - priority: 60
    name: imperative_preference
    type: preference
    pattern: "^(请|please\\s+)?(do|don't|make sure|avoid|prefer|use|不要)"

  - priority: 50
    name: question_tentative
    type: tentative
    pattern: "^(是不是该|要不要|该不该)"

  - priority: 0
    name: default
    type: fact
    pattern: ".*"
    note: 默认归类为 fact；模糊时升级为反问

# v0.2.0: NOT triggered on every input
# Only runs after user invokes /kb-capture
trigger: explicit_only
